[project]
name = "itk-vtk"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "itk>=5.4.6",
    "notebook>=7.5.6",
    "vtk>=9.6.2",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "ruff>=0.15.15",
]
[tool.ruff]
line-length = 100
target-version = "py311"  
src = ["src"]
extend-exclude = ["notebooks", "data"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (tri des imports)
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "NPY",  # numpy-specific (utile pour ton workflow image/ML)
    "PD",   # pandas-vet
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  
    "N806",  
    "N803", 
]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402", "F401", "F811"]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "itk.*",
    "vtk.*",
    "SimpleITK.*",
]
ignore_missing_imports = true
